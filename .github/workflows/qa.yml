name: QA

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/pepes-napoli-test
      MONGODB_TEST_URI: mongodb://127.0.0.1:27017/pepes-napoli-test
      JWT_SECRET: ci-only-secret-with-more-than-32-characters
      CORS_ORIGINS: http://localhost:5173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests
        run: npm test

  panel:
    name: Panel build and lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: panel

    env:
      VITE_API_URL: http://localhost:5000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: panel/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint
